[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "small-model-redteaming"
version = "0.1.1"
description = "A comprehensive AI redteaming framework for testing small language models across multiple safety and alignment dimensions, including deceptive alignment detection, evaluation awareness testing, data exfiltration prevention, and meta-cognition analysis with statistical significance testing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Ryan Hartman", email = "ryan.h4rtman@gmail.com"}
]
maintainers = [
    {name = "Ryan Hartman", email = "ryan.h4rtman@gmail.com"}
]
keywords = [
    "ai-safety",
    "red-teaming", 
    "language-models",
    "alignment",
    "evaluation",
    "deceptive-alignment",
    "eval-awareness",
    "data-exfiltration",
    "gpt-oss",
    "kaggle",
    "benchmarking"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "python-dotenv>=0.19.0",
    "lm-eval>=0.4.9.1",
    "openai>=1.101.0",
    "requests>=2.25.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "asyncio-throttle>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "pre-commit>=2.17.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=3.0.0",
    "coverage>=6.0.0",
]
docs = [
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.17.0",
]
visualization = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/ryanhartman4/oss-redteaming"
Documentation = "https://github.com/ryanhartman4/oss-redteaming#readme"
Repository = "https://github.com/ryanhartman4/oss-redteaming"
"Bug Tracker" = "https://github.com/ryanhartman4/oss-redteaming/issues"
Changelog = "https://github.com/ryanhartman4/oss-redteaming/blob/main/CHANGELOG.md"

# Entry point commented out - main.py needs to be moved to package
# [project.scripts]
# redteam = "small_model_redteaming.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["small_model_redteaming*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
small_model_redteaming = ["*.md", "*.txt", "*.json"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["small_model_redteaming"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
    "local_tests",
]
pythonpath = [
    "."
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["small_model_redteaming"]
omit = [
    "*/tests/*",
    "*/local_tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "twine>=6.1.0",
]
